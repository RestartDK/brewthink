name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-checks:
    name: Rust (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: format
            command: fmt --all -- --check
          - name: host tests
            command: test --locked --lib --target x86_64-unknown-linux-gnu
          - name: reader and EPUB tests
            command: test --locked --lib --features device-reader,sd-write-diagnostic,epub,grayscale-bench --target x86_64-unknown-linux-gnu
          - name: device control tests
            command: test --locked --features device-control --bin device-control --target x86_64-unknown-linux-gnu
          - name: host tools Clippy
            command: clippy --locked --features host-image-tools,device-control,device-reader,epub --lib --bin prepare-image --bin device-control --bin inspect-epub --bin inspect-device-epub --target x86_64-unknown-linux-gnu -- -D warnings
          - name: firmware Clippy
            command: clippy --locked --lib --bin brewthink -- -D warnings
          - name: SD write Clippy
            command: clippy --locked --lib --bin brewthink --features sd-write-diagnostic -- -D warnings
          - name: SD diagnostic Clippy
            command: clippy --locked --lib --bin brewthink --features sd-diagnostic -- -D warnings
          - name: reader Clippy
            command: clippy --locked --lib --bin brewthink --features device-reader -- -D warnings
          - name: grayscale bench Clippy
            command: clippy --locked --lib --bin brewthink --features grayscale-bench -- -D warnings
          - name: WASM library
            command: check --locked --lib --target wasm32-unknown-unknown
    steps:
      - uses: actions/checkout@v6
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo ${{ matrix.command }}

  host-protocol:
    name: Host protocol and image tools
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --target x86_64-unknown-linux-gnu --features device-control,host-image-tools --bin device-control --bin prepare-image
      - run: python3 -m unittest discover -s tools -p 'test_*.py' -v
        env:
          DEVICE_CONTROL_BIN: target/x86_64-unknown-linux-gnu/debug/device-control
          PREPARE_IMAGE_BIN: target/x86_64-unknown-linux-gnu/debug/prepare-image

  firmware:
    name: Firmware images and reader stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y llvm libudev-dev
      - run: cargo install espflash --version 4.5.0 --locked
      - run: python3 -m pip install esptool==5.3.1
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: scripts/check-firmware.sh
      - name: Save image inspection reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-image-reports
          path: artifacts/ci/*.txt
          if-no-files-found: error

  web-simulator:
    name: Web simulator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.121 --locked
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Build production assets
        working-directory: web
        run: bun run build
      - name: Install Chromium
        working-directory: web
        run: bunx playwright install --with-deps chromium
      - name: Test production assets
        working-directory: web
        run: bun run test:e2e
        env:
          BREWTHINK_WALKTHROUGH_DIR: ../artifacts/walkthrough
      - name: Test development reload
        working-directory: web
        run: bun run test:e2e:dev
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-browser-evidence
          path: |
            artifacts/walkthrough
            web/test-results
