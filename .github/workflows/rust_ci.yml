name: Continuous Integration

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-checks:
    name: Rust Checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        action:
          - command: build
            args: --release
          - command: fmt
            args: --all -- --check
          - command: clippy
            args: --lib --bin brewthink -- -D warnings
          - command: clippy
            args: --features host-image-tools --bin prepare-image --target x86_64-unknown-linux-gnu -- -D warnings
          - command: test
            args: --lib --target x86_64-unknown-linux-gnu
          - command: test
            args: --lib --features sd-write-diagnostic --target x86_64-unknown-linux-gnu
          - command: clippy
            args: --lib --bin brewthink --features sd-write-diagnostic -- -D warnings
          - command: test
            args: --lib --features device-reader,epub --target x86_64-unknown-linux-gnu
          - command: test
            args: --lib --features device-reader,grayscale-bench --target x86_64-unknown-linux-gnu
          - command: clippy
            args: --lib --bin brewthink --features grayscale-bench -- -D warnings
          - command: test
            args: --features device-control --bin device-control --target x86_64-unknown-linux-gnu
          - command: clippy
            args: --lib --bin brewthink --features device-reader -- -D warnings
          - command: clippy
            args: --lib --bin brewthink --features sd-diagnostic -- -D warnings
          - command: check
            args: --lib --target wasm32-unknown-unknown
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          target: riscv32imc-unknown-none-elf,wasm32-unknown-unknown
          toolchain: stable
          components: rust-src, rustfmt, clippy
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
      - name: Run command
        run: cargo ${{ matrix.action.command }} ${{ matrix.action.args }}

  host-protocol:
    name: Host protocol and image tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --target x86_64-unknown-linux-gnu --features device-control,host-image-tools --bin device-control --bin prepare-image
      - run: python3 -m unittest discover -s tools -p 'test_*.py' -v
        env:
          DEVICE_CONTROL_BIN: target/x86_64-unknown-linux-gnu/debug/device-control
          PREPARE_IMAGE_BIN: target/x86_64-unknown-linux-gnu/debug/prepare-image
      - run: cargo clippy --target x86_64-unknown-linux-gnu --features device-control,host-image-tools --bin device-control --bin prepare-image -- -D warnings

  reader-stack:
    name: Reader stack budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          target: riscv32imc-unknown-none-elf
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y llvm
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo build --release --bin brewthink --features device-reader
        env:
          BREWTHINK_DIAGNOSTIC_STAGE: reader-app
      - run: python3 scripts/check-reader-stack.py target/riscv32imc-unknown-none-elf/release/brewthink

  web-simulator:
    name: Web simulator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          toolchain: stable
          components: rust-src
      - name: Enable Rust caching
        uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.121 --locked
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Build simulator
        working-directory: web
        run: bun run build
      - name: Install Chromium
        working-directory: web
        run: bunx playwright install --with-deps chromium
      - name: Test simulator
        working-directory: web
        run: bun run test:e2e
        env:
          BREWTHINK_WALKTHROUGH_DIR: ../artifacts/walkthrough
      - name: Save simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-walkthrough
          path: artifacts/walkthrough
