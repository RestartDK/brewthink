name: Continuous Integration

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-checks:
    name: Rust Checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        action:
          - command: build
            args: --release
          - command: fmt
            args: --all -- --check
          - command: clippy
            args: --lib --bin brewthink -- -D warnings
          - command: clippy
            args: --features host-image-tools --bin prepare-image --target x86_64-unknown-linux-gnu -- -D warnings
          - command: test
            args: --lib --target x86_64-unknown-linux-gnu
          - command: check
            args: --lib --target wasm32-unknown-unknown
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          target: riscv32imc-unknown-none-elf,wasm32-unknown-unknown
          toolchain: stable
          components: rust-src, rustfmt, clippy
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
      - name: Run command
        run: cargo ${{ matrix.action.command }} ${{ matrix.action.args }}

  web-simulator:
    name: Web simulator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          toolchain: stable
          components: rust-src
      - name: Enable Rust caching
        uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.121 --locked
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Build simulator
        working-directory: web
        run: bun run build
      - name: Install Chromium
        working-directory: web
        run: bunx playwright install --with-deps chromium
      - name: Test simulator
        working-directory: web
        run: bun run test:e2e
