[package]
edition      = "2024"
name         = "brewthink"
rust-version = "1.88"
version      = "0.1.0"

[features]
default             = []
device-control      = ["dep:crc32fast", "dep:image", "dep:libc"]
device-reader       = ["sd-card", "dep:crc32fast", "dep:embedded-io", "dep:embedded-png", "dep:miniz_oxide", "dep:tjpgd-rs"]
epub                = ["dep:quick-xml", "dep:zip"]
host-image-tools    = ["dep:image"]
sd-card             = ["dep:embedded-sdmmc"]
sd-write-diagnostic = ["sd-card"]
web-sim             = ["dep:image", "dep:wasm-bindgen", "epub"]

[[bin]]
name = "brewthink"
path = "./src/bin/main.rs"

[[bin]]
name              = "device-control"
path              = "./tools/device-control.rs"
required-features = ["device-control"]

[[bin]]
name              = "prepare-image"
path              = "./src/bin/prepare-image.rs"
required-features = ["host-image-tools"]

[[bin]]
name              = "inspect-epub"
path              = "./src/bin/inspect-epub.rs"
required-features = ["epub"]

[[bin]]
name              = "inspect-device-epub"
path              = "./src/bin/inspect-device-epub.rs"
required-features = ["device-reader"]

[[bin]]
name              = "web-sim"
path              = "./src/bin/web-sim.rs"
required-features = ["web-sim"]

[dependencies]
crc32fast         = { version = "=1.5.0", optional = true, default-features = false }
embedded-graphics = "0.8.1"
embedded-hal      = "1.0.0"
embedded-io       = { version = "=0.7.1", optional = true, default-features = false }
embedded-png      = { version = "=0.1.1", optional = true, default-features = false }
embedded-sdmmc    = { version = "=0.10.0", optional = true }
miniz_oxide       = { version = "=0.9.1", optional = true, default-features = false }
tjpgd-rs          = { version = "=0.1.0", optional = true, default-features = false }
quick-xml         = { version = "=0.39.2", optional = true }
zip               = { version = "=6.0.0", optional = true, default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(not(target_arch = "riscv32"))'.dependencies]
image = { version = "0.25.10", optional = true, default-features = false, features = ["bmp", "jpeg", "png", "pnm"] }
libc  = { version = "=0.2.189", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "=0.2.121", optional = true }

[target.'cfg(target_arch = "riscv32")'.dependencies]
defmt                  = "1.0.1"
embassy-executor       = { version = "0.10.0", features = ["defmt"] }
embassy-time           = { version = "0.5.0", features = ["defmt"] }
esp-backtrace          = { version = "0.19.0", features = ["defmt", "esp32c3", "panic-handler"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["defmt", "esp32c3"] }
esp-hal                = { version = "~1.1.0", features = ["defmt", "esp32c3", "unstable"] }
esp-println            = { version = "0.17.0", features = ["defmt-espflash", "esp32c3"] }
esp-rtos               = { version = "0.3.0", features = ["defmt", "embassy", "esp32c3"] }
nb                     = "1.1.0"
static_cell            = "2.1.1"


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
