[target.riscv32imc-unknown-none-elf]
# Intentionally no Cargo runner yet.
#
# The generated template used:
# runner = "espflash flash --monitor --chip esp32c3 --log-format defmt"
#
# That would make `cargo run` write a generic ESP32-C3 image to the X4.
# Re-enable a runner only after Brewthink has an X4-safe flashing script that
# checks the chip, flash size, image size, partition offset, and recovery plan.

[env]
DEFMT_LOG="info"

[build]
rustflags = [
  # Required to obtain backtraces (e.g. when using the "esp-backtrace" crate.)
  # NOTE: May negatively impact performance of produced code
  "-C", "force-frame-pointers",
]

target = "riscv32imc-unknown-none-elf"

[unstable]
build-std = ["alloc", "core"]
